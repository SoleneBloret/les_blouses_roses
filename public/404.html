<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8F5">
  <title>Page introuvable — Les Blouses Roses</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --rose:        #E5007D;  /* $lbr-rose */
      --rose-fonce:  #B5005F;
      --orange:      #F19F38;  /* $lbr-orange */
      --creme:       #FFF8F5;  /* $lbr-creme */
      --creme-ombre: #FDE8F3;  /* $lbr-rose_pale */
      --encre:       #2D1B2E;  /* $lbr-text */
      --encre-douce: #9B7FA0;  /* $lbr-text2 */
      --blanc:       #FFFFFF;
      --rayon:       26px;
      --police:      "Nunito", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--police);
      background-color: var(--creme);
      color: var(--encre);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }

    .deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .halo { position: absolute; border-radius: 50%; filter: blur(8px); opacity: .5; }
    .halo--rose  { width: 320px; height: 320px; top: -120px; right: -110px;
      background: radial-gradient(circle at 30% 30%, rgba(229,0,125,.22), transparent 70%); }
    .halo--orange{ width: 360px; height: 360px; bottom: -150px; left: -120px;
      background: radial-gradient(circle at 60% 40%, rgba(241,159,56,.28), transparent 70%); }

    .confetti { position: absolute; border-radius: 4px; opacity: .55; }
    .c1 { width: 14px; height: 14px; background: var(--orange); top: 16%; left: 14%; transform: rotate(20deg); }
    .c2 { width: 11px; height: 11px; background: var(--rose); top: 24%; right: 18%; border-radius: 50%; }
    .c3 { width: 16px; height: 16px; background: var(--orange); bottom: 22%; right: 12%; border-radius: 50%; }
    .c4 { width: 12px; height: 12px; background: var(--rose); bottom: 18%; left: 18%; transform: rotate(35deg); }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: apparition .7s cubic-bezier(.2,.7,.3,1) both;
    }

    .illustration {
      width: 188px;
      height: auto;
      margin-bottom: 8px;
      animation: flotte 5s ease-in-out infinite;
      transform-origin: center;
    }

    .code {
      display: inline-block;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--rose);
      background: var(--blanc);
      border: 2px solid var(--creme-ombre);
      padding: 7px 16px;
      border-radius: 999px;
      margin: 18px 0 16px;
      box-shadow: 0 6px 18px rgba(229,0,125,.08);
    }

    h1 {
      font-weight: 900;
      font-size: clamp(28px, 8vw, 34px);
      line-height: 1.2;
      color: var(--encre);
      margin-bottom: 16px;
      letter-spacing: -.01em;
    }

    p.message {
      font-size: 19px;
      font-weight: 600;
      color: var(--encre-douce);
      max-width: 36ch;
      margin-bottom: 34px;
    }

    .bouton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      min-height: 60px;
      padding: 0 28px;
      background: var(--rose);
      color: var(--blanc);
      font-family: var(--police);
      font-weight: 800;
      font-size: 20px;
      text-decoration: none;
      border: none;
      border-radius: var(--rayon);
      box-shadow: 0 10px 24px rgba(229,0,125,.32);
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
      cursor: pointer;
    }
    .bouton:hover  { background: var(--rose-fonce); }
    .bouton:active { transform: translateY(2px); box-shadow: 0 5px 14px rgba(229,0,125,.3); }
    .bouton:focus-visible { outline: 4px solid var(--orange); outline-offset: 4px; }
    .bouton svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes flotte {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%       { transform: translateY(-14px) rotate(1.5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .illustration { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="deco" aria-hidden="true">
    <span class="halo halo--rose"></span>
    <span class="halo halo--orange"></span>
    <span class="confetti c1"></span>
    <span class="confetti c2"></span>
    <span class="confetti c3"></span>
    <span class="confetti c4"></span>
  </div>

  <main>
    <svg class="illustration" viewBox="0 0 200 220" role="img" aria-label="Une montgolfière qui s'éloigne dans le ciel">
      <defs>
        <linearGradient id="ballon" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F19F38"/>
          <stop offset="100%" stop-color="#E5007D"/>
        </linearGradient>
      </defs>
      <ellipse cx="38" cy="150" rx="26" ry="13" fill="#FFFFFF" opacity=".9"/>
      <ellipse cx="160" cy="58" rx="22" ry="11" fill="#FFFFFF" opacity=".85"/>
      <path d="M100 18c34 0 58 26 58 60 0 30-24 52-38 70H80C66 130 42 108 42 78c0-34 24-60 58-60z" fill="url(#ballon)"/>
      <path d="M100 18c-16 0-26 27-26 64s10 64 26 64M100 18c16 0 26 27 26 64s-10 64-26 64" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".55"/>
      <path d="M84 146l8 26M116 146l-8 26" stroke="#2D1B2E" stroke-width="2.4" opacity=".55" fill="none"/>
      <rect x="88" y="172" width="24" height="20" rx="5" fill="#B5005F"/>
      <rect x="88" y="172" width="24" height="7" rx="3.5" fill="#E5007D"/>
      <path d="M150 130c2.4-2.6 6.4-2.6 8.8 0 2.4-2.6 6.4-2.6 8.8 0 2.4 2.6 1.2 6-4.4 10.4-5.6-4.4-6.8-7.8-4.4-10.4z" fill="#E5007D" opacity=".8"/>
    </svg>

    <span class="code">Erreur 404</span>

    <h1>Cette page a pris la clé des champs</h1>

    <p class="message">
      Pas d'inquiétude&nbsp;! La page que vous cherchez n'existe pas ou a été déplacée.
      Revenons ensemble en terrain connu.
    </p>

    <a class="bouton" href="/">
      <svg viewBox="0 0 576 512" aria-hidden="true" focusable="false">
        <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/>
      </svg>
      Retour à l'accueil
    </a>
  </main>
</body>
</html>
