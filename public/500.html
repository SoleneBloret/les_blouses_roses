<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFF8F5">
  <title>Une erreur est survenue — Les Blouses Roses</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --rose:        #E5007D;  /* $lbr-rose */
      --rose-fonce:  #B5005F;
      --orange:      #F19F38;  /* $lbr-orange */
      --creme:       #FFF8F5;  /* $lbr-creme */
      --creme-ombre: #FDE8F3;  /* $lbr-rose_pale */
      --encre:       #2D1B2E;  /* $lbr-text */
      --encre-douce: #9B7FA0;  /* $lbr-text2 */
      --blanc:       #FFFFFF;
      --rayon:       26px;
      --police:      "Nunito", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--police);
      background-color: var(--creme);
      color: var(--encre);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }

    .deco { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .halo { position: absolute; border-radius: 50%; filter: blur(8px); opacity: .5; }
    .halo--orange { width: 340px; height: 340px; top: -130px; left: -110px;
      background: radial-gradient(circle at 40% 40%, rgba(241,159,56,.28), transparent 70%); }
    .halo--rose   { width: 320px; height: 320px; bottom: -140px; right: -110px;
      background: radial-gradient(circle at 50% 40%, rgba(229,0,125,.22), transparent 70%); }

    .confetti { position: absolute; border-radius: 4px; opacity: .55; }
    .c1 { width: 13px; height: 13px; background: var(--orange); top: 18%; right: 16%; border-radius: 50%; }
    .c2 { width: 11px; height: 11px; background: var(--rose); top: 26%; left: 16%; transform: rotate(25deg); }
    .c3 { width: 15px; height: 15px; background: var(--orange); bottom: 20%; left: 13%; border-radius: 50%; }
    .c4 { width: 12px; height: 12px; background: var(--rose); bottom: 22%; right: 18%; transform: rotate(40deg); }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: apparition .7s cubic-bezier(.2,.7,.3,1) both;
    }

    .illustration {
      width: 176px;
      height: auto;
      margin-bottom: 8px;
      animation: battement 3.2s ease-in-out infinite;
      transform-origin: center;
    }

    .code {
      display: inline-block;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--rose);
      background: var(--blanc);
      border: 2px solid var(--creme-ombre);
      padding: 7px 16px;
      border-radius: 999px;
      margin: 18px 0 16px;
      box-shadow: 0 6px 18px rgba(229,0,125,.08);
    }

    h1 {
      font-weight: 900;
      font-size: clamp(28px, 8vw, 34px);
      line-height: 1.2;
      color: var(--encre);
      margin-bottom: 16px;
      letter-spacing: -.01em;
    }

    p.message {
      font-size: 19px;
      font-weight: 600;
      color: var(--encre-douce);
      max-width: 38ch;
      margin-bottom: 34px;
    }

    .bouton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      min-height: 60px;
      padding: 0 28px;
      background: var(--rose);
      color: var(--blanc);
      font-family: var(--police);
      font-weight: 800;
      font-size: 20px;
      text-decoration: none;
      border: none;
      border-radius: var(--rayon);
      box-shadow: 0 10px 24px rgba(229,0,125,.32);
      transition: transform .15s ease, background-color .15s ease, box-shadow .15s ease;
      cursor: pointer;
    }
    .bouton:hover  { background: var(--rose-fonce); }
    .bouton:active { transform: translateY(2px); box-shadow: 0 5px 14px rgba(229,0,125,.3); }
    .bouton:focus-visible { outline: 4px solid var(--orange); outline-offset: 4px; }
    .bouton svg { width: 22px; height: 22px; fill: currentColor; flex: none; }

    @keyframes apparition {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes battement {
      0%, 100% { transform: scale(1); }
      15%       { transform: scale(1.06); }
      30%       { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      main, .illustration { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="deco" aria-hidden="true">
    <span class="halo halo--orange"></span>
    <span class="halo halo--rose"></span>
    <span class="confetti c1"></span>
    <span class="confetti c2"></span>
    <span class="confetti c3"></span>
    <span class="confetti c4"></span>
  </div>

  <main>
    <svg class="illustration" viewBox="0 0 200 200" role="img" aria-label="Un cœur soigné avec un pansement">
      <defs>
        <linearGradient id="coeur" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F19F38"/>
          <stop offset="100%" stop-color="#E5007D"/>
        </linearGradient>
      </defs>
      <path d="M100 176C40 134 24 104 24 74 24 48 44 30 68 30c16 0 27 8 32 20 5-12 16-20 32-20 24 0 44 18 44 44 0 30-16 60-76 102z" fill="url(#coeur)"/>
      <g transform="rotate(-32 100 96)">
        <rect x="62" y="78" width="76" height="36" rx="18" fill="#FFF8F5" stroke="#FDE8F3" stroke-width="2"/>
        <rect x="88" y="78" width="24" height="36" fill="#FFFFFF" opacity=".0"/>
        <g fill="#E5007D" opacity=".55">
          <circle cx="95" cy="88" r="2.4"/>
          <circle cx="105" cy="88" r="2.4"/>
          <circle cx="95" cy="96" r="2.4"/>
          <circle cx="105" cy="96" r="2.4"/>
          <circle cx="95" cy="104" r="2.4"/>
          <circle cx="105" cy="104" r="2.4"/>
        </g>
      </g>
    </svg>

    <span class="code">Erreur 500</span>

    <h1>Un petit bobo technique de notre côté</h1>

    <p class="message">
      Quelque chose s'est mal passé sur nos serveurs — et ce n'est pas de votre faute.
      Nos équipes prennent déjà soin du problème. Merci de réessayer dans un instant.
    </p>

    <a class="bouton" href="/">
      <svg viewBox="0 0 576 512" aria-hidden="true" focusable="false">
        <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 2.7-.2 5.4-.5 8.1V472c0 22.1-17.9 40-40 40H456c-1.1 0-2.2 0-3.3-.1c-1.4 .1-2.8 .1-4.2 .1H416 392c-22.1 0-40-17.9-40-40V448 384c0-17.7-14.3-32-32-32H256c-17.7 0-32 14.3-32 32v64 24c0 22.1-17.9 40-40 40H160 128.1c-1.5 0-3-.1-4.5-.2c-1.2 .1-2.4 .2-3.6 .2H104c-22.1 0-40-17.9-40-40V360c0-.9 0-1.9 .1-2.8V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/>
      </svg>
      Retour à l'accueil
    </a>
  </main>
</body>
</html>
